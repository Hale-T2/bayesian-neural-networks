# Renders the notebooks to HTML and publishes index.html + notebooks on GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# The notebooks are committed with their outputs, so nothing is re-executed here.
name: Publish course site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install nbconvert
        run: pip install nbconvert
      - name: Render notebooks to HTML
        run: |
          mkdir -p _site/notebooks
          cp index.html _site/
          cp notebooks/*.ipynb _site/notebooks/
          jupyter nbconvert --to html --output-dir _site/notebooks notebooks/*.ipynb
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
